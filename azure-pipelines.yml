trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'

steps:
  - task: UseDotNet@2
    displayName: 'Instalar .NET 8'
    inputs:
      packageType: 'sdk'
      version: '8.x'

  - script: dotnet restore PortafolioMVC.csproj
    displayName: 'Restaurar dependencias'

  - script: dotnet build PortafolioMVC.csproj --configuration $(buildConfiguration) --no-restore
    displayName: 'Compilar proyecto'

  - script: dotnet publish PortafolioMVC.csproj --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory) --no-build
    displayName: 'Preparar publicación'

  - task: PublishBuildArtifacts@1
    displayName: 'Guardar archivos publicados'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: 'portafolio-mvc'
      publishLocation: 'Container'

  - task: AzureRmWebAppDeployment@5
    displayName: 'Publicar en Azure App Service'
    inputs:
      ConnectionType: 'AzureRM'
      azureSubscription: 'Azure for Students(5138ed01-9a92-4ab5-a7ae-aead36db656b)'
      appType: 'webAppLinux'
      WebAppName: 'portafolio-nohe-mvc'
      packageForLinux: '$(Build.ArtifactStagingDirectory)'
      DeploymentTypeLinux: 'oneDeploy'